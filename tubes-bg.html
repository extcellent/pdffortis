<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>

<canvas id="blackhole"></canvas>

<script>

(() => {

"use strict";

/* ================================================================
   NEXUS BLACK HOLE
   Self-contained WebGL2/WEBGL iframe background
   ================================================================ */

const canvas =
    document.getElementById("blackhole");

const gl =
    canvas.getContext("webgl2", {
        alpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: "high-performance"
    }) ||
    canvas.getContext("webgl", {
        alpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: "high-performance"
    });

if (!gl) {
    console.error("WebGL unavailable");
    return;
}


/* ================================================================
   STATE
   ================================================================ */

let W = 1;
let H = 1;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

const mouse = {
    x: .5,
    y: .5,

    tx: .5,
    ty: .5,

    vx: 0,
    vy: 0,

    speed: 0
};

let lastMouseX = .5;
let lastMouseY = .5;

let startTime = performance.now();

let pulse = 0;
let explosion = 0;


/* ================================================================
   RESIZE
   ================================================================ */

function resize() {

    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* ================================================================
   POINTER
   ================================================================ */

window.addEventListener(
    "pointermove",
    e => {

        const nx =
            e.clientX / W;

        const ny =
            e.clientY / H;

        mouse.vx =
            nx - lastMouseX;

        mouse.vy =
            ny - lastMouseY;

        mouse.speed =
            Math.min(
                1,
                Math.sqrt(
                    mouse.vx * mouse.vx +
                    mouse.vy * mouse.vy
                ) * 12
            );

        mouse.tx = nx;
        mouse.ty = ny;

        lastMouseX = nx;
        lastMouseY = ny;
    },
    { passive: true }
);


/* ================================================================
   INTERACTION
   ================================================================ */

window.addEventListener(
    "pointerdown",
    () => {

        pulse = 1;
        explosion = 1;

    },
    { passive: true }
);

window.addEventListener(
    "dblclick",
    () => {

        pulse = 1.5;
        explosion = 1.5;

    }
);

window.addEventListener(
    "keydown",
    e => {

        if (e.code === "Space") {

            pulse = 1.4;
            explosion = 1.4;

        }

    }
);


/* ================================================================
   FULL SCREEN SHADER
   ================================================================ */

const vertexSource = `

attribute vec2 a_position;

void main() {

    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );

}
`;


/*
================================================================
FRAGMENT SHADER

This is the actual black hole.

The important difference from a normal "glowing circle":

We're calculating a distorted coordinate field around
an event horizon and then sampling procedural volumetric
noise through that warped field.
================================================================
*/

const fragmentSource = `

precision highp float;

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;
uniform float u_speed;
uniform float u_pulse;
uniform float u_explosion;


/* ================================================================
   HASH
   ================================================================ */

float hash21(vec2 p) {

    p =
        fract(
            p *
            vec2(
                123.34,
                456.21
            )
        );

    p +=
        dot(
            p,
            p + 45.32
        );

    return fract(
        p.x * p.y
    );
}


/* ================================================================
   NOISE
   ================================================================ */

float noise(vec2 p) {

    vec2 i =
        floor(p);

    vec2 f =
        fract(p);

    f =
        f *
        f *
        (3.0 - 2.0 * f);

    return mix(

        mix(
            hash21(i),
            hash21(
                i +
                vec2(
                    1.0,
                    0.0
                )
            ),
            f.x
        ),

        mix(
            hash21(
                i +
                vec2(
                    0.0,
                    1.0
                )
            ),

            hash21(
                i +
                vec2(
                    1.0,
                    1.0
                )
            ),

            f.x
        ),

        f.y
    );
}


/* ================================================================
   FRACTAL BROWNIAN MOTION
   ================================================================ */

float fbm(vec2 p) {

    float value = 0.0;
    float amp = .5;

    for(int i = 0; i < 6; i++) {

        value +=
            noise(p) *
            amp;

        p *= 2.02;
        amp *= .5;
    }

    return value;
}


/* ================================================================
   ROTATION
   ================================================================ */

mat2 rot(float a) {

    float c = cos(a);
    float s = sin(a);

    return mat2(
        c, -s,
        s,  c
    );
}


/* ================================================================
   MAIN
   ================================================================ */

void main() {

    /*
    --------------------------------------------------------------
    SCREEN COORDINATES
    --------------------------------------------------------------
    */

    vec2 uv =
        gl_FragCoord.xy /
        u_resolution.xy;

    vec2 p =
        uv -
        .5;

    p.x *=
        u_resolution.x /
        u_resolution.y;


    /*
    --------------------------------------------------------------
    MOUSE POSITION

    The black hole follows the cursor.
    --------------------------------------------------------------
    */

    vec2 m =
        u_mouse -
        .5;

    m.x *=
        u_resolution.x /
        u_resolution.y;


    /*
    --------------------------------------------------------------
    LOCAL SPACE AROUND BLACK HOLE
    --------------------------------------------------------------
    */

    vec2 q =
        p -
        m;


    float r =
        length(q);

    float angle =
        atan(
            q.y,
            q.x
        );


    /*
    ==============================================================
                    GRAVITATIONAL LENSING
    ==============================================================

    The coordinate itself is bent.

    This is what makes the region around the event horizon
    visually "pull" the surrounding field around it.
    */

    float gravity =
        .115 /
        max(
            r,
            .025
        );


    gravity =
        min(
            gravity,
            2.4
        );


    vec2 lens =
        normalize(
            q +
            vec2(.00001)
        );


    q +=
        lens *
        gravity *
        .065;


    /*
    Additional angular deflection.
    */

    float lensAngle =
        gravity *
        .9;


    q =
        rot(
            lensAngle
        ) *
        q;


    /*
    Recalculate.
    */

    r =
        length(q);

    angle =
        atan(
            q.y,
            q.x
        );


    /*
    ==============================================================
                         SPACETIME SWIRL
    ==============================================================

    Close to the horizon the entire coordinate system rotates.
    */

    float swirl =
        1.8 *
        exp(
            -r *
            3.8
        );


    angle +=
        swirl;


    /*
    ==============================================================
                         VOLUMETRIC SPACE
    ==============================================================

    Multiple layers moving at different rates.
    */

    vec2 flow =
        vec2(
            cos(angle),
            sin(angle)
        ) *
        r;


    flow *=
        3.4;


    flow.x +=
        u_time *
        .00006;

    flow.y -=
        u_time *
        .000035;


    float n1 =
        fbm(flow);


    float n2 =
        fbm(
            flow *
            2.1 +
            vec2(
                -u_time * .00008,
                u_time * .00005
            )
        );


    float n3 =
        fbm(
            flow *
            .42 -
            vec2(
                u_time * .000025,
                0.0
            )
        );


    /*
    ==============================================================
                      ACCRETION DISK
    ==============================================================

    A luminous rotating disk around the horizon.
    */

    float diskDistance =
        abs(
            r -
            .245
        );


    float disk =
        exp(
            -diskDistance *
            38.0
        );


    /*
    Turbulence inside disk.
    */

    float diskNoise =
        fbm(
            vec2(
                angle * 4.0,
                r * 35.0
            )
            +
            u_time *
            vec2(
                -.0007,
                .00012
            )
        );


    disk *=
        .55 +
        diskNoise *
        1.3;


    /*
    Rotating bright sections.
    */

    float rotating =
        .5 +
        .5 *
        sin(
            angle *
            8.0
            -
            u_time *
            .0022
        );


    disk *=
        .55 +
        rotating *
        .75;


    /*
    ==============================================================
                         INNER RING
    ============================================================== */

    float innerRing =
        exp(
            -abs(
                r -
                .105
            )
            *
            85.0
        );


    innerRing *=
        .4 +
        .6 *
        sin(
            angle *
            18.0
            -
            u_time *
            .003
        );


    /*
    ==============================================================
                        OUTER RINGS
    ============================================================== */

    float ring1 =
        pow(
            max(
                0.0,
                sin(
                    r *
                    42.0
                    -
                    u_time *
                    .001
                )
            ),
            20.0
        );


    ring1 *=
        smoothstep(
            .7,
            .08,
            r
        );


    float ring2 =
        pow(
            max(
                0.0,
                sin(
                    r *
                    73.0
                    +
                    angle *
                    3.0
                    -
                    u_time *
                    .0015
                )
            ),
            35.0
        );


    ring2 *=
        smoothstep(
            .55,
            .12,
            r
        );


    /*
    ==============================================================
                       ENERGY FILAMENTS
    ============================================================== */

    float filament =
        abs(
            sin(
                angle *
                17.0
                +
                r *
                32.0
                -
                u_time *
                .001
            )
        );


    filament =
        pow(
            filament,
            19.0
        );


    filament *=
        smoothstep(
            .65,
            .05,
            r
        );


    /*
    ==============================================================
                         EVENT HORIZON
    ============================================================== */

    float horizon =
        smoothstep(
            .115,
            .065,
            r
        );


    /*
    ==============================================================
                             CORE
    ============================================================== */

    float core =
        exp(
            -r *
            75.0
        );


    /*
    ==============================================================
                       PHOTON RING
    ============================================================== */

    float photon =
        exp(
            -abs(
                r -
                .073
            )
            *
            160.0
        );


    photon *=
        .5 +
        .5 *
        sin(
            angle *
            12.0
            -
            u_time *
            .004
        );


    /*
    ==============================================================
                     MOUSE VELOCITY ENERGY
    ============================================================== */

    float velocityEnergy =
        u_speed *
        (
            .5 +
            .5 *
            sin(
                angle -
                u_time *
                .002
            )
        );


    /*
    ==============================================================
                       SHOCKWAVE
    ============================================================== */

    float waveRadius =
        .08 +
        u_pulse *
        .8;


    float wave =
        exp(
            -abs(
                r -
                waveRadius
            )
            *
            80.0
        );


    wave *=
        u_pulse;


    /*
    ==============================================================
                       EXPLOSION SHELL
    ============================================================== */

    float blast =
        exp(
            -abs(
                r -
                (
                    .12 +
                    u_explosion *
                    .9
                )
            )
            *
            20.0
        );


    blast *=
        u_explosion;


    /*
    ==============================================================
                            COLORS
    ============================================================== */

    vec3 black =
        vec3(
            0.0,
            0.0,
            0.002
        );


    vec3 cyan =
        vec3(
            .01,
            .75,
            1.0
        );


    vec3 electricBlue =
        vec3(
            .02,
            .18,
            1.0
        );


    vec3 violet =
        vec3(
            .45,
            .02,
            1.0
        );


    vec3 magenta =
        vec3(
            1.0,
            .015,
            .35
        );


    vec3 white =
        vec3(
            1.0,
            .98,
            .92
        );


    /*
    --------------------------------------------------------------
    BASE SPACE
    --------------------------------------------------------------
    */

    vec3 color =
        black;


    /*
    Nebula volume.
    */

    color +=
        cyan *
        n1 *
        .075;


    color +=
        electricBlue *
        n2 *
        .10;


    color +=
        violet *
        n3 *
        .055;


    /*
    Accretion disk.
    */

    color +=
        cyan *
        disk *
        .72;


    color +=
        violet *
        disk *
        .24;


    color +=
        magenta *
        disk *
        .12;


    /*
    Inner ring.
    */

    color +=
        electricBlue *
        innerRing *
        .75;


    color +=
        magenta *
        innerRing *
        .32;


    /*
    Photon ring.
    */

    color +=
        white *
        photon *
        1.25;


    /*
    Procedural outer rings.
    */

    color +=
        cyan *
        ring1 *
        .22;


    color +=
        violet *
        ring2 *
        .18;


    /*
    Filaments.
    */

    color +=
        magenta *
        filament *
        .28;


    color +=
        cyan *
        filament *
        .20;


    /*
    Velocity energy.
    */

    color +=
        magenta *
        velocityEnergy *
        filament *
        .45;


    /*
    Shockwave.
    */

    color +=
        cyan *
        wave *
        1.25;


    color +=
        violet *
        wave *
        .5;


    /*
    Explosion.
    */

    color +=
        white *
        blast *
        .55;


    color +=
        magenta *
        blast *
        .8;


    /*
    Event horizon.

    Almost all light disappears here.
    */

    color *=
        1.0 -
        horizon *
        .98;


    /*
    Black-hole core.
    */

    color +=
        white *
        core *
        2.0;


    /*
    ==============================================================
                    CHROMATIC ABERRATION
    ==============================================================

    Artificial RGB separation around the gravitational edge.
    */

    float aberration =
        smoothstep(
            .34,
            .05,
            r
        )
        *
        (
            1.0 -
            smoothstep(
                .04,
                .09,
                r
            )
        );


    color.r +=
        aberration *
        .22;


    color.b +=
        aberration *
        .38;


    /*
    ==============================================================
                       DISTANT ENERGY FIELD
    ============================================================== */

    float field =
        exp(
            -r *
            .9
        );


    color +=
        cyan *
        field *
        n1 *
        .035;


    /*
    ==============================================================
                          VIGNETTE
    ============================================================== */

    float screenDistance =
        length(
            (
                gl_FragCoord.xy /
                u_resolution.xy
            )
            *
            2.0
            -
            1.0
        );


    float vignette =
        smoothstep(
            1.5,
            .35,
            screenDistance
        );


    color *=
        vignette;


    /*
    ==============================================================
                        HDR TONEMAPPING
    ============================================================== */

    color =
        color /
        (
            1.0 +
            color
        );


    color =
        pow(
            color,
            vec3(
                .82
            )
        );


    /*
    ==============================================================
                           ALPHA
    ==============================================================

    Critical for iframe transparency.
    */

    float brightness =
        max(
            color.r,
            max(
                color.g,
                color.b
            )
        );


    float alpha =
        smoothstep(
            .004,
            .12,
            brightness
        );


    /*
    Keep the effect atmospheric rather
    than creating an opaque rectangle.
    */

    alpha *=
        .82;


    gl_FragColor =
        vec4(
            color,
            alpha
        );

}

`;


/* ================================================================
   COMPILE
   ================================================================ */

function compile(
    type,
    source
) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );

    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        return null;
    }

    return shader;
}


const vertex =
    compile(
        gl.VERTEX_SHADER,
        vertexSource
    );


const fragment =
    compile(
        gl.FRAGMENT_SHADER,
        fragmentSource
    );


if (!vertex || !fragment) {
    return;
}


const program =
    gl.createProgram();


gl.attachShader(
    program,
    vertex
);

gl.attachShader(
    program,
    fragment
);

gl.linkProgram(
    program
);


if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
) {

    console.error(
        gl.getProgramInfoLog(program)
    );

    return;
}


gl.useProgram(
    program
);


/* ================================================================
   FULL SCREEN TRIANGLE
   ================================================================ */

const buffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,

    new Float32Array([

        -1, -1,

         3, -1,

        -1,  3

    ]),

    gl.STATIC_DRAW
);


const position =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    position
);


gl.vertexAttribPointer(
    position,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* ================================================================
   UNIFORMS
   ================================================================ */

const uniforms = {

    resolution:
        gl.getUniformLocation(
            program,
            "u_resolution"
        ),

    mouse:
        gl.getUniformLocation(
            program,
            "u_mouse"
        ),

    time:
        gl.getUniformLocation(
            program,
            "u_time"
        ),

    speed:
        gl.getUniformLocation(
            program,
            "u_speed"
        ),

    pulse:
        gl.getUniformLocation(
            program,
            "u_pulse"
        ),

    explosion:
        gl.getUniformLocation(
            program,
            "u_explosion"
        )
};


/* ================================================================
   BLENDING
   ================================================================ */

gl.enable(
    gl.BLEND
);

gl.blendFunc(
    gl.SRC_ALPHA,
    gl.ONE
);


/* ================================================================
   RENDER
   ================================================================ */

function render(now) {

    /*
    Smooth pointer.
    */

    mouse.x +=
        (
            mouse.tx -
            mouse.x
        )
        *
        .075;


    mouse.y +=
        (
            mouse.ty -
            mouse.y
        )
        *
        .075;


    /*
    Velocity decay.
    */

    mouse.vx *= .91;
    mouse.vy *= .91;

    mouse.speed *= .93;


    /*
    Event decay.
    */

    pulse *= .965;

    explosion *= .95;


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    gl.clearColor(
        0,
        0,
        0,
        0
    );


    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    gl.useProgram(
        program
    );


    gl.uniform2f(
        uniforms.resolution,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        uniforms.mouse,
        mouse.x,
        1.0 - mouse.y
    );


    gl.uniform1f(
        uniforms.time,
        now -
        startTime
    );


    gl.uniform1f(
        uniforms.speed,
        mouse.speed
    );


    gl.uniform1f(
        uniforms.pulse,
        pulse
    );


    gl.uniform1f(
        uniforms.explosion,
        explosion
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}


requestAnimationFrame(
    render
);


/* ================================================================
   CLEANUP WHEN IFRAME IS UNLOADED
   ================================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            const loseContext =
                gl.getExtension(
                    "WEBGL_lose_context"
                );

            if (loseContext) {
                loseContext.loseContext();
            }

        } catch (_) {}

    }
);

})();

</script>

</body>
</html>
