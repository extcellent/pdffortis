<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEXUS</title>

<style>

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: transparent;
}

canvas {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: transparent;
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>


<script type="module">

/*
══════════════════════════════════════════════════════════════════════
 N E X U S
 Interactive dimensional fluid field
 Designed specifically for iframe embedding
══════════════════════════════════════════════════════════════════════
*/


import(
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
)
.then(({ default: THREE }) => {


/*
══════════════════════════════════════════════════════════════════════
                          SETUP
══════════════════════════════════════════════════════════════════════
*/


const canvas =
  document.getElementById("canvas");


const renderer =
  new THREE.WebGLRenderer({

    canvas,

    alpha: true,

    antialias: true,

    powerPreference:
      "high-performance"
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);


renderer.setClearColor(
  0x000000,
  0
);


const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    55,
    1,
    .1,
    100
  );


camera.position.z =
  8;


/*
══════════════════════════════════════════════════════════════════════
                           SIZE
══════════════════════════════════════════════════════════════════════
*/


let width =
  window.innerWidth;

let height =
  window.innerHeight;


function resize() {

  width =
    window.innerWidth;

  height =
    window.innerHeight;


  renderer.setSize(
    width,
    height,
    false
  );


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();

}


resize();


window.addEventListener(
  "resize",
  resize
);


/*
══════════════════════════════════════════════════════════════════════
                         POINTER
══════════════════════════════════════════════════════════════════════
*/


const pointer = {

  x: 0,

  y: 0,

  targetX: 0,

  targetY: 0,

  vx: 0,

  vy: 0,

  speed: 0
};


window.addEventListener(
  "pointermove",
  event => {

    const nx =
      event.clientX /
      width;

    const ny =
      event.clientY /
      height;


    pointer.vx =
      nx -
      pointer.targetX;


    pointer.vy =
      ny -
      pointer.targetY;


    pointer.targetX =
      nx;

    pointer.targetY =
      ny;


    pointer.speed =
      Math.min(
        1,
        Math.sqrt(
          pointer.vx *
          pointer.vx +
          pointer.vy *
          pointer.vy
        ) * 8
      );

  }
);


/*
══════════════════════════════════════════════════════════════════════
                    PROCEDURAL SHADER
══════════════════════════════════════════════════════════════════════
*/


const vertexShader = `

varying vec2 vUv;

void main() {

  vUv = uv;

  gl_Position =
    projectionMatrix *
    modelViewMatrix *
    vec4(
      position,
      1.0
    );

}

`;


const fragmentShader = `

precision highp float;


/*
──────────────────────────────────────────────────────────────────────
UNIFORMS
──────────────────────────────────────────────────────────────────────
*/


uniform float uTime;

uniform vec2 uMouse;

uniform float uSpeed;


/*
──────────────────────────────────────────────────────────────────────
UV
──────────────────────────────────────────────────────────────────────
*/


varying vec2 vUv;


/*
──────────────────────────────────────────────────────────────────────
HASH
──────────────────────────────────────────────────────────────────────
*/


float hash(
  vec2 p
) {

  return fract(
    sin(
      dot(
        p,
        vec2(
          127.1,
          311.7
        )
      )
    )
    *
    43758.5453123
  );

}


/*
──────────────────────────────────────────────────────────────────────
NOISE
──────────────────────────────────────────────────────────────────────
*/


float noise(
  vec2 p
) {

  vec2 i =
    floor(p);

  vec2 f =
    fract(p);


  f =
    f *
    f *
    (
      3.0 -
      2.0 *
      f
    );


  return mix(

    mix(
      hash(i),
      hash(
        i +
        vec2(
          1.0,
          0.0
        )
      ),
      f.x
    ),

    mix(
      hash(
        i +
        vec2(
          0.0,
          1.0
        )
      ),

      hash(
        i +
        vec2(
          1.0,
          1.0
        )
      ),

      f.x
    ),

    f.y
  );

}


/*
──────────────────────────────────────────────────────────────────────
FBM
──────────────────────────────────────────────────────────────────────
*/


float fbm(
  vec2 p
) {

  float value =
    0.0;

  float amplitude =
    .5;


  for(
    int i = 0;
    i < 6;
    i++
  ) {

    value +=
      noise(p) *
      amplitude;


    p *=
      2.0;


    amplitude *=
      .5;
  }


  return value;
}


/*
══════════════════════════════════════════════════════════════════════
                          MAIN
══════════════════════════════════════════════════════════════════════
*/


void main() {


  /*
  Center coordinates.
  */

  vec2 uv =
    vUv -
    .5;


  uv.x *=
    1.65;


  /*
  Mouse.

  */

  vec2 mouse =
    uMouse -
    .5;


  mouse.x *=
    1.65;


  /*
  Distance from cursor.
  */

  vec2 delta =
    uv -
    mouse;


  float distance =
    length(delta);


  /*
  ═══════════════════════════════════════════════════════════════
                       GRAVITY FIELD
  ═══════════════════════════════════════════════════════════════
  */


  float gravity =
    exp(
      -distance *
      3.5
    );


  /*
  Bend space.
  */

  uv +=
    normalize(
      delta +
      .00001
    )
    *
    gravity
    *
    .15;


  /*
  Spiral distortion.
  */

  float angle =
    atan(
      uv.y,
      uv.x
    );


  float radius =
    length(uv);


  angle +=
    gravity *
    2.5;


  uv =
    vec2(
      cos(angle),
      sin(angle)
    )
    *
    radius;


  /*
  ═══════════════════════════════════════════════════════════════
                        LIVING CLOUD
  ═══════════════════════════════════════════════════════════════
  */


  vec2 flow =
    uv *
    3.0;


  flow.x +=
    uTime *
    .00012;


  flow.y -=
    uTime *
    .00008;


  float cloud =
    fbm(flow);


  /*
  Secondary distortion.
  */

  float cloud2 =
    fbm(
      flow *
      2.4
      +
      cloud
    );


  /*
  ═══════════════════════════════════════════════════════════════
                       ENERGY FILAMENTS
  ═══════════════════════════════════════════════════════════════
  */


  float filament =
    abs(
      sin(
        angle *
        14.0
        +
        radius *
        25.0
        -
        uTime *
        .001
      )
    );


  filament =
    pow(
      filament,
      14.0
    );


  /*
  ═══════════════════════════════════════════════════════════════
                         ACCRETION RING
  ═══════════════════════════════════════════════════════════════
  */


  float ring =
    exp(
      -abs(
        radius -
        .22
      )
      *
      38.0
    );


  ring *=
    .5 +
    .5 *
    sin(
      angle *
      9.0
      -
      uTime *
      .002
    );


  /*
  ═══════════════════════════════════════════════════════════════
                         EVENT HORIZON
  ═══════════════════════════════════════════════════════════════
  */


  float horizon =
    smoothstep(
      .18,
      .06,
      radius
    );


  /*
  ═══════════════════════════════════════════════════════════════
                             CORE
  ═══════════════════════════════════════════════════════════════
  */


  float core =
    exp(
      -radius *
      55.0
    );


  /*
  ═══════════════════════════════════════════════════════════════
                           COLORS
  ═══════════════════════════════════════════════════════════════
  */


  vec3 cyan =
    vec3(
      .0,
      .8,
      1.0
    );


  vec3 blue =
    vec3(
      .05,
      .25,
      1.0
    );


  vec3 violet =
    vec3(
      .55,
      .05,
      1.0
    );


  vec3 pink =
    vec3(
      1.0,
      .02,
      .45
    );


  /*
  Base remains mostly transparent/dark.
  */

  vec3 color =
    vec3(
      0.0
    );


  /*
  Nebula.
  */

  color +=
    cyan *
    cloud *
    .14;


  color +=
    blue *
    cloud2 *
    .18;


  /*
  Filaments.
  */

  color +=
    violet *
    filament *
    .4;


  /*
  Accretion disk.
  */

  color +=
    cyan *
    ring *
    .8;


  color +=
    pink *
    ring *
    .25;


  /*
  Core.
  */

  color +=
    vec3(
      .7,
      .95,
      1.0
    )
    *
    core *
    3.0;


  /*
  Cursor speed increases energy.
  */

  color +=
    pink *
    uSpeed *
    filament *
    .5;


  /*
  Dark event horizon.
  */

  color *=
    1.0 -
    horizon *
    .97;


  /*
  Fade toward edges.

  This is IMPORTANT for iframe usage.

  */

  float edge =
    smoothstep(
      .95,
      .25,
      length(
        vUv -
        .5
      )
      *
      1.25
    );


  color *=
    edge;


  /*
  Soft HDR response.
  */

  color =
    color /
    (
      1.0 +
      color
    );


  color =
    pow(
      color,
      vec3(
        .82
      )
    );


  /*
  Alpha is based on brightness.

  Therefore the iframe itself
  remains transparent.
  */

  float alpha =
    max(
      max(
        color.r,
        color.g
      ),
      color.b
    );


  alpha =
    smoothstep(
      .005,
      .22,
      alpha
    );


  alpha *=
    .9;


  gl_FragColor =
    vec4(
      color,
      alpha
    );

}

`;


/*
══════════════════════════════════════════════════════════════════════
                          MATERIAL
══════════════════════════════════════════════════════════════════════
*/


const material =
  new THREE.ShaderMaterial({

    vertexShader,

    fragmentShader,

    transparent: true,

    depthWrite: false,

    blending:
      THREE.AdditiveBlending,

    uniforms: {

      uTime: {

        value: 0

      },

      uMouse: {

        value: new THREE.Vector2(
          .5,
          .5
        )

      },

      uSpeed: {

        value: 0

      }

    }

  });


/*
══════════════════════════════════════════════════════════════════════
                            PLANE
══════════════════════════════════════════════════════════════════════
*/


const geometry =
  new THREE.PlaneGeometry(
    2,
    2
  );


const plane =
  new THREE.Mesh(
    geometry,
    material
  );


scene.add(
  plane
);


/*
══════════════════════════════════════════════════════════════════════
                      ORBITAL PARTICLE FIELD
══════════════════════════════════════════════════════════════════════
*/


const particleCount =
  width < 700
    ? 700
    : 1800;


const positions =
  new Float32Array(
    particleCount *
    3
  );


const colors =
  new Float32Array(
    particleCount *
    3
  );


const sizes =
  new Float32Array(
    particleCount
  );


for(
  let i = 0;
  i < particleCount;
  i++
) {


  const angle =
    Math.random() *
    Math.PI *
    2;


  const radius =
    Math.pow(
      Math.random(),
      .55
    )
    *
    7;


  const z =
    (
      Math.random() -
      .5
    )
    *
    2;


  positions[
    i * 3
  ] =
    Math.cos(angle) *
    radius;


  positions[
    i * 3 + 1
  ] =
    Math.sin(angle) *
    radius *
    .32;


  positions[
    i * 3 + 2
  ] =
    z;


  /*
  Color spectrum.
  */

  const color =
    new THREE.Color();


  const hue =
    .5 +
    Math.random() *
    .5;


  color.setHSL(
    hue,
    1,
    .65
  );


  colors[
    i * 3
  ] =
    color.r;


  colors[
    i * 3 + 1
  ] =
    color.g;


  colors[
    i * 3 + 2
  ] =
    color.b;


  sizes[i] =
    Math.random() *
    3 +
    1;
}


const particleGeometry =
  new THREE.BufferGeometry();


particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(
    positions,
    3
  )
);


particleGeometry.setAttribute(
  "color",
  new THREE.BufferAttribute(
    colors,
    3
  )
);


particleGeometry.setAttribute(
  "size",
  new THREE.BufferAttribute(
    sizes,
    1
  )
);


const particleMaterial =
  new THREE.PointsMaterial({

    size:
      .025,

    vertexColors:
      true,

    transparent:
      true,

    opacity:
      .65,

    depthWrite:
      false,

    blending:
      THREE.AdditiveBlending
  });


const particles =
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );


scene.add(
  particles
);


/*
══════════════════════════════════════════════════════════════════════
                       PARTICLE ANIMATION
══════════════════════════════════════════════════════════════════════
*/


function animateParticles() {

  /*
  Slow orbital rotation.
  */

  particles.rotation.z +=
    .0008;


  /*
  Cursor causes dimensional tilt.
  */

  particles.rotation.x +=
    (
      pointer.targetY -
      .5 -
      particles.rotation.x
    )
    *
    .002;


  particles.rotation.y +=
    (
      pointer.targetX -
      .5 -
      particles.rotation.y
    )
    *
    .002;

}


/*
══════════════════════════════════════════════════════════════════════
                           ANIMATION
══════════════════════════════════════════════════════════════════════
*/


const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const elapsed =
    clock.getElapsedTime();


  /*
  Smooth pointer.
  */

  pointer.x +=
    (
      pointer.targetX -
      pointer.x
    )
    *
    .065;


  pointer.y +=
    (
      pointer.targetY -
      pointer.y
    )
    *
    .065;


  pointer.vx *=
    .92;


  pointer.vy *=
    .92;


  pointer.speed *=
    .94;


  /*
  Shader state.
  */

  material.uniforms
    .uTime.value =
      elapsed *
      1000;


  material.uniforms
    .uMouse.value
    .set(
      pointer.x,
      1.0 -
      pointer.y
    );


  material.uniforms
    .uSpeed.value =
      pointer.speed;


  /*
  3D particle world.
  */

  animateParticles();


  /*
  Tiny camera breathing.

  */

  camera.position.x +=
    (
      pointer.x -
      .5
    )
    *
    .003;


  camera.position.y +=
    (
      .5 -
      pointer.y
    )
    *
    .003;


  camera.lookAt(
    0,
    0,
    0
  );


  renderer.render(
    scene,
    camera
  );

}


animate();


})
.catch(
  error => {

    console.error(
      "NEXUS failed:",
      error
    );

  }
);

</script>

</body>
</html>
```
