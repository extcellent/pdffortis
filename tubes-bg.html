<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Mandala · Bio-Geometric Evolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a10;
            overflow: hidden;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        #glow {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: all 0.05s ease;
        }
    </style>
</head>
<body>
    <div id="glow"></div>
    <canvas id="canvas"></canvas>

    <script>
        // ================================================================
        // LIVING MANDALA · BIO-GEOMETRIC EVOLUTION
        // A living organism that grows, breathes, and evolves
        // ================================================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ---- Mouse tracking ----
        let mx = W/2, my = H/2;
        let tx = W/2, ty = H/2;
        
        document.addEventListener('mousemove', (e) => {
            tx = e.clientX;
            ty = e.clientY;
            const glow = document.getElementById('glow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t) {
                tx = t.clientX;
                ty = t.clientY;
                const glow = document.getElementById('glow');
                glow.style.left = t.clientX + 'px';
                glow.style.top = t.clientY + 'px';
            }
        }, { passive: true });

        // ---- Living Mandala System ----
        class Mandala {
            constructor() {
                this.segments = 12;
                this.layers = 6;
                this.points = [];
                this.time = 0;
                this.phase = Math.random() * Math.PI * 2;
                this.colorHue = Math.random() * 360;
                this.evolution = 0;
                this.generate();
            }

            generate() {
                this.points = [];
                for (let layer = 0; layer < this.layers; layer++) {
                    const radius = 30 + (layer / (this.layers - 1)) * Math.min(W, H) * 0.4;
                    const count = this.segments * (layer + 1);
                    const layerPoints = [];
                    
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        const wobble = 0.2 + Math.sin(i * 0.7 + layer) * 0.3;
                        layerPoints.push({
                            angle: angle,
                            radius: radius,
                            wobble: wobble,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.5 + Math.random() * 0.5
                        });
                    }
                    this.points.push(layerPoints);
                }
            }

            update(mx, my) {
                this.time += 0.01;
                this.evolution += 0.001;
                this.colorHue = (this.colorHue + 0.05) % 360;
                
                // Mouse influence
                const dx = mx - W/2;
                const dy = my - H/2;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = Math.min(W, H) * 0.5;
                const influence = Math.min(dist / maxDist, 1);
                
                // Evolve structure based on time
                if (this.time % 5 < 0.01) {
                    this.segments = 8 + Math.floor(Math.sin(this.evolution) * 4 + 8);
                    this.layers = 4 + Math.floor(Math.sin(this.evolution * 0.7) * 2 + 4);
                    this.generate();
                }
            }

            draw(ctx) {
                const centerX = W/2;
                const centerY = H/2;
                
                // Draw connections between layers
                for (let l = 0; l < this.points.length - 1; l++) {
                    const layer1 = this.points[l];
                    const layer2 = this.points[l + 1];
                    
                    for (let i = 0; i < Math.min(layer1.length, layer2.length); i++) {
                        const p1 = layer1[i % layer1.length];
                        const p2 = layer2[i % layer2.length];
                        
                        const time1 = this.time * p1.speed + p1.phase;
                        const time2 = this.time * p2.speed + p2.phase;
                        
                        const r1 = p1.radius * (1 + Math.sin(time1) * p1.wobble * 0.3);
                        const r2 = p2.radius * (1 + Math.sin(time2) * p2.wobble * 0.3);
                        
                        const x1 = centerX + Math.cos(p1.angle + this.time * 0.1) * r1;
                        const y1 = centerY + Math.sin(p1.angle + this.time * 0.1) * r1;
                        const x2 = centerX + Math.cos(p2.angle + this.time * 0.1) * r2;
                        const y2 = centerY + Math.sin(p2.angle + this.time * 0.1) * r2;
                        
                        const hue = (this.colorHue + i * 360 / layer1.length + l * 20) % 360;
                        const alpha = 0.1 + Math.sin(this.time + i * 0.1) * 0.05 + 0.05;
                        
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `hsla(${hue}, 80%, 70%, ${alpha})`;
                        ctx.lineWidth = 0.5 + Math.sin(this.time * 0.5 + i) * 0.5;
                        ctx.stroke();
                    }
                }

                // Draw points with glow
                for (let l = 0; l < this.points.length; l++) {
                    const layer = this.points[l];
                    
                    for (let i = 0; i < layer.length; i++) {
                        const p = layer[i];
                        const time = this.time * p.speed + p.phase;
                        const radius = p.radius * (1 + Math.sin(time) * p.wobble * 0.3);
                        
                        const x = centerX + Math.cos(p.angle + this.time * 0.1) * radius;
                        const y = centerY + Math.sin(p.angle + this.time * 0.1) * radius;
                        
                        const hue = (this.colorHue + i * 360 / layer.length + l * 30) % 360;
                        const size = 2 + Math.sin(time) * 1 + 2;
                        
                        // Glow
                        const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 4);
                        gradient.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.6)`);
                        gradient.addColorStop(0.5, `hsla(${hue + 30}, 100%, 60%, 0.2)`);
                        gradient.addColorStop(1, `hsla(${hue + 60}, 100%, 40%, 0)`);
                        
                        ctx.beginPath();
                        ctx.arc(x, y, size * 4, 0, Math.PI * 2);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                        
                        // Core
                        ctx.beginPath();
                        ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue + 60}, 100%, 90%, 0.8)`;
                        ctx.fill();
                    }
                }

                // Draw radial beams
                for (let i = 0; i < this.points[0].length; i++) {
                    const p = this.points[0][i];
                    const time = this.time * p.speed + p.phase;
                    const radius = p.radius * (1 + Math.sin(time) * p.wobble * 0.3);
                    
                    const x = centerX + Math.cos(p.angle + this.time * 0.1) * radius;
                    const y = centerY + Math.sin(p.angle + this.time * 0.1) * radius;
                    
                    const hue = (this.colorHue + i * 360 / this.points[0].length) % 360;
                    
                    // Beam from center to point
                    const gradient = ctx.createLinearGradient(centerX, centerY, x, y);
                    gradient.addColorStop(0, `hsla(${hue}, 100%, 80%, 0)`);
                    gradient.addColorStop(0.5, `hsla(${hue + 20}, 100%, 70%, 0.03)`);
                    gradient.addColorStop(1, `hsla(${hue + 40}, 100%, 60%, 0.1)`);
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 1 + Math.sin(this.time + i) * 0.5;
                    ctx.stroke();
                }
            }
        }

        // ---- Create multiple mandalas ----
        const mandalas = [];
        const count = 3;
        for (let i = 0; i < count; i++) {
            const m = new Mandala();
            m.phase = (i / count) * Math.PI * 2;
            m.colorHue = (i / count) * 360;
            mandalas.push(m);
        }

        // ---- Background nebula ----
        function drawBackground(ctx) {
            const time = Date.now() * 0.0001;
            const gradient = ctx.createRadialGradient(
                W * 0.3 + Math.sin(time) * 100,
                H * 0.3 + Math.cos(time * 0.7) * 100,
                0,
                W * 0.5,
                H * 0.5,
                Math.max(W, H) * 0.8
            );
            
            const hue = (Date.now() * 0.002) % 360;
            gradient.addColorStop(0, `hsla(${hue}, 60%, 8%, 0.3)`);
            gradient.addColorStop(0.5, `hsla(${hue + 40}, 50%, 5%, 0.1)`);
            gradient.addColorStop(1, 'rgba(10, 10, 16, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);
        }

        // ---- Click to transform ----
        function transform() {
            mandalas.forEach(m => {
                m.segments = 6 + Math.floor(Math.random() * 10);
                m.layers = 3 + Math.floor(Math.random() * 6);
                m.colorHue = Math.random() * 360;
                m.generate();
            });
        }

        canvas.addEventListener('click', transform);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            transform();
        }, { passive: false });

        // ---- Animation loop ----
        function animate() {
            // Smooth mouse
            mx += (tx - mx) * 0.05;
            my += (ty - my) * 0.05;

            // Clear
            ctx.fillStyle = 'rgba(10, 10, 16, 0.05)';
            ctx.fillRect(0, 0, W, H);
            
            drawBackground(ctx);

            // Update and draw mandalas
            for (const m of mandalas) {
                m.update(mx, my);
                m.draw(ctx);
            }

            // Mouse influence overlay
            const gradient = ctx.createRadialGradient(mx, my, 0, mx, my, 150);
            gradient.addColorStop(0, 'rgba(255,255,255,0.02)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            resize();
        });
    </script>
</body>
</html>
