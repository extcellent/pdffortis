<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

}

body {

    position: relative;

}

canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

}

#tubes {

    z-index: 1;

}

#fractures {

    z-index: 2;

    pointer-events: none;

}

#glow {

    z-index: 3;

    pointer-events: none;

    mix-blend-mode: screen;

}

</style>

</head>

<body>

<canvas id="tubes"></canvas>

<canvas id="fractures"></canvas>

<canvas id="glow"></canvas>


<script>

/* ================================================================
   
   F R A C T U R E D   D I M E N S I O N
   
   A procedural rainbow reality fracture.
   
   ================================================================ */


/* ================================================================
   CANVASES
   ================================================================ */

const tubesCanvas =
    document.getElementById("tubes");

const fractureCanvas =
    document.getElementById("fractures");

const glowCanvas =
    document.getElementById("glow");

const ctx =
    fractureCanvas.getContext("2d");

const glow =
    glowCanvas.getContext("2d");


/* ================================================================
   SIZE
   ================================================================ */

let W = 1;
let H = 1;
let DPR = 1;

function resize() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    fractureCanvas.width =
        W * DPR;

    fractureCanvas.height =
        H * DPR;

    glowCanvas.width =
        W * DPR;

    glowCanvas.height =
        H * DPR;

    fractureCanvas.style.width =
        W + "px";

    fractureCanvas.style.height =
        H + "px";

    glowCanvas.style.width =
        W + "px";

    glowCanvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    glow.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ================================================================
   POINTER
   ================================================================ */

const mouse = {

    x: W * .5,
    y: H * .5,

    tx: W * .5,
    ty: H * .5,

    vx: 0,
    vy: 0,

    speed: 0

};


let previousX =
    mouse.x;

let previousY =
    mouse.y;


window.addEventListener(
    "pointermove",
    e => {

        mouse.tx =
            e.clientX;

        mouse.ty =
            e.clientY;

        mouse.vx =
            mouse.tx -
            previousX;

        mouse.vy =
            mouse.ty -
            previousY;

        mouse.speed =
            Math.min(
                35,
                Math.sqrt(
                    mouse.vx *
                    mouse.vx +
                    mouse.vy *
                    mouse.vy
                )
            );

        previousX =
            mouse.tx;

        previousY =
            mouse.ty;

    },
    {
        passive: true
    }
);


/* ================================================================
   FRACTURE SYSTEM
   ================================================================ */

const fractures = [];

const MAX_FRACTURES =
    18;


/* ================================================================
   RANDOM
   ================================================================ */

function random(
    min,
    max
) {

    return (
        Math.random() *
        (
            max -
            min
        )
    ) + min;

}


/* ================================================================
   CREATE FRACTURE
   ================================================================ */

function createFracture(
    x,
    y,
    angle,
    length,
    depth = 0
) {

    if (
        depth >
        4
    ) {
        return;
    }


    const points = [];

    let px =
        x;

    let py =
        y;

    let direction =
        angle;


    const segments =
        Math.floor(
            random(
                7,
                18
            )
        );


    for (
        let i = 0;
        i < segments;
        i++
    ) {

        direction +=
            random(
                -.42,
                .42
            );


        const step =
            length /
            segments *
            random(
                .65,
                1.35
            );


        px +=
            Math.cos(
                direction
            ) *
            step;

        py +=
            Math.sin(
                direction
            ) *
            step;


        points.push({

            x: px,

            y: py

        });

    }


    fractures.push({

        x,
        y,

        angle,

        points,

        life: 1,

        width:
            random(
                .8,
                2.8
            ),

        hue:
            random(
                0,
                360
            ),

        phase:
            random(
                0,
                Math.PI * 2
            ),

        depth

    });


    /*
    Branches.

    */

    if (
        depth <
        3 &&
        Math.random() <
        .72
    ) {

        const branchIndex =
            Math.floor(
                random(
                    2,
                    segments - 2
                )
            );


        const branch =
            points[
                branchIndex
            ];


        createFracture(

            branch.x,

            branch.y,

            angle +
            random(
                -.9,
                .9
            ),

            length *
            random(
                .35,
                .65
            ),

            depth + 1

        );

    }

}


/* ================================================================
   INITIAL FRACTURE NETWORK
   ================================================================ */

function generateFractures() {

    fractures.length =
        0;


    /*
    Main dimensional rupture.
    */

    const centerX =
        W * .5;

    const centerY =
        H * .5;


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        createFracture(

            centerX +
            random(
                -120,
                120
            ),

            centerY +
            random(
                -100,
                100
            ),

            random(
                0,
                Math.PI * 2
            ),

            random(
                W * .18,
                W * .48
            )

        );

    }


    /*
    Peripheral fractures.
    */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        createFracture(

            random(
                0,
                W
            ),

            random(
                0,
                H
            ),

            random(
                0,
                Math.PI * 2
            ),

            random(
                100,
                350
            )

        );

    }

}

generateFractures();


/* ================================================================
   FLOATING PARTICLES
   ================================================================ */

const particles = [];

const particleCount =
    W < 700
        ? 250
        : 600;


for (
    let i = 0;
    i < particleCount;
    i++
) {

    particles.push({

        x:
            random(
                0,
                W
            ),

        y:
            random(
                0,
                H
            ),

        vx:
            random(
                -.15,
                .15
            ),

        vy:
            random(
                -.15,
                .15
            ),

        size:
            random(
                .4,
                2.3
            ),

        hue:
            random(
                0,
                360
            ),

        phase:
            random(
                0,
                Math.PI * 2
            )

    });

}


/* ================================================================
   RAINBOW
   ================================================================ */

function rainbow(
    hue,
    saturation = 100,
    lightness = 65
) {

    return `
        hsl(
            ${hue},
            ${saturation}%,
            ${lightness}%
        )
    `;

}


/* ================================================================
   TUBES ENGINE
   
   THIS IS THE PART THAT KEEPS THE SAME WORKING ARCHITECTURE
   AS YOUR ORIGINAL.
   ================================================================ */

function randomColors(
    count
) {

    return Array.from(
        {
            length:
                count
        },

        function() {

            const hue =
                Math.floor(
                    Math.random() *
                    360
                );

            return `
                hsl(
                    ${hue},
                    100%,
                    65%
                )
            `;

        }
    );

}


import(
    "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"
)

.then(
    function(mod) {

        const TubesCursor =
            mod.default;


        const app =
            TubesCursor(
                tubesCanvas,
                {

                    tubes: {

                        colors: [

                            "#00ffff",

                            "#0066ff",

                            "#7a00ff",

                            "#ff00cc",

                            "#ff0066",

                            "#ff6600"

                        ],

                        lights: {

                            intensity:
                                220,

                            colors: [

                                "#00ffff",

                                "#0066ff",

                                "#9d00ff",

                                "#ff00cc",

                                "#ff0066",

                                "#00ff88"

                            ]

                        }

                    }

                }
            );


        /*
        ------------------------------------------------------------
        PERIODIC COLOR EVOLUTION
        ------------------------------------------------------------
        */

        let hueShift =
            0;


        setInterval(
            () => {

                hueShift +=
                    27;


                const colors = [

                    `hsl(${hueShift},100%,65%)`,

                    `hsl(${hueShift + 55},100%,65%)`,

                    `hsl(${hueShift + 110},100%,65%)`

                ];


                const lights = [

                    `hsl(${hueShift + 25},100%,70%)`,

                    `hsl(${hueShift + 150},100%,70%)`,

                    `hsl(${hueShift + 240},100%,70%)`,

                    `hsl(${hueShift + 310},100%,70%)`

                ];


                try {

                    app.tubes
                        .setColors(
                            colors
                        );

                    app.tubes
                        .setLightsColors(
                            lights
                        );

                }

                catch (_) {}

            },

            2600

        );


        /*
        ------------------------------------------------------------
        CLICK = DIMENSIONAL COLLAPSE
        ------------------------------------------------------------
        */

        window.addEventListener(
            "click",
            () => {

                try {

                    app.tubes
                        .setColors(
                            randomColors(
                                3
                            )
                        );

                    app.tubes
                        .setLightsColors(
                            randomColors(
                                4
                            )
                        );

                }

                catch (_) {}


                /*
                New fracture explosion.
                */

                for (
                    let i = 0;
                    i < 7;
                    i++
                ) {

                    createFracture(

                        mouse.x,

                        mouse.y,

                        random(
                            0,
                            Math.PI * 2
                        ),

                        random(
                            150,
                            450
                        )

                    );

                }

            }
        );

    }
)

.catch(
    function(err) {

        console.error(
            "Tubes engine failed:",
            err
        );

    }
);


/* ================================================================
   DRAW FRACTURES
   ================================================================ */

function drawFractures(
    time
) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
    Screen blend gives the cracks
    a true light-emitting appearance.
    */

    ctx.globalCompositeOperation =
        "screen";


    for (
        let i = 0;
        i < fractures.length;
        i++
    ) {

        const f =
            fractures[i];


        /*
        Cursor attraction.

        */

        let closest =
            Infinity;


        for (
            let j = 0;
            j < f.points.length;
            j++
        ) {

            const p =
                f.points[j];


            const dx =
                p.x -
                mouse.x;

            const dy =
                p.y -
                mouse.y;


            const d =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            closest =
                Math.min(
                    closest,
                    d
                );

        }


        const activation =
            Math.max(
                0,
                1 -
                closest /
                420
            );


        /*
        Animated intensity.
        */

        const flicker =
            .65 +
            .35 *
            Math.sin(
                time *
                .004 +
                f.phase
            );


        const hue =
            (
                f.hue +
                time *
                .025 +
                activation *
                120
            )
            %
            360;


        /*
        Glow layer.
        */

        glow.beginPath();

        glow.moveTo(
            f.x,
            f.y
        );


        for (
            let j = 0;
            j < f.points.length;
            j++
        ) {

            glow.lineTo(
                f.points[j].x,
                f.points[j].y
            );

        }


        glow.strokeStyle =
            rainbow(
                hue,
                100,
                60
            );


        glow.lineWidth =
            (
                f.width *
                8
            )
            +
            activation *
            18;


        glow.globalAlpha =
            .025 +
            activation *
            .08;


        glow.stroke();


        /*
        Main crack.
        */

        ctx.beginPath();

        ctx.moveTo(
            f.x,
            f.y
        );


        for (
            let j = 0;
            j < f.points.length;
            j++
        ) {

            ctx.lineTo(
                f.points[j].x,
                f.points[j].y
            );

        }


        ctx.strokeStyle =
            rainbow(
                hue,
                100,
                68 +
                activation *
                20
            );


        ctx.lineWidth =
            f.width *
            (
                1 +
                activation *
                1.8
            );


        ctx.globalAlpha =
            (
                .22 +
                activation *
                .7
            )
            *
            flicker;


        ctx.shadowBlur =
            5 +
            activation *
            25;


        ctx.shadowColor =
            rainbow(
                hue
            );


        ctx.stroke();


        /*
        White-hot core.
        */

        if (
            activation >
            .15
        ) {

            ctx.beginPath();

            ctx.moveTo(
                f.x,
                f.y
            );


            for (
                let j = 0;
                j < f.points.length;
                j++
            ) {

                ctx.lineTo(
                    f.points[j].x,
                    f.points[j].y
                );

            }


            ctx.strokeStyle =
                "#ffffff";


            ctx.lineWidth =
                .35 +
                activation *
                .8;


            ctx.globalAlpha =
                activation *
                .8;


            ctx.shadowBlur =
                10;


            ctx.shadowColor =
                rainbow(
                    hue
                );


            ctx.stroke();

        }

    }


    ctx.shadowBlur =
        0;

}


/* ================================================================
   PARTICLE FIELD
   ================================================================ */

function drawParticles(
    time
) {

    ctx.globalCompositeOperation =
        "lighter";


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const p =
            particles[i];


        /*
        Cursor gravity.
        */

        const dx =
            mouse.x -
            p.x;

        const dy =
            mouse.y -
            p.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const force =
            Math.max(
                0,
                1 -
                distance /
                500
            );


        p.vx +=
            dx /
            (
                distance +
                1
            )
            *
            force
            *
            .025;


        p.vy +=
            dy /
            (
                distance +
                1
            )
            *
            force
            *
            .025;


        /*
        Orbital component.
        */

        p.vx +=
            -dy /
            (
                distance +
                100
            )
            *
            force
            *
            .012;


        p.vy +=
            dx /
            (
                distance +
                100
            )
            *
            force
            *
            .012;


        /*
        Velocity.
        */

        p.x +=
            p.vx;

        p.y +=
            p.vy;


        /*
        Friction.
        */

        p.vx *=
            .992;

        p.vy *=
            .992;


        /*
        Wrap.
        */

        if (
            p.x < -20
        )
            p.x = W + 20;

        if (
            p.x > W + 20
        )
            p.x = -20;

        if (
            p.y < -20
        )
            p.y = H + 20;

        if (
            p.y > H + 20
        )
            p.y = -20;


        /*
        Particle brightness.
        */

        const brightness =
            .45 +
            force *
            2 +
            Math.sin(
                time *
                .003 +
                p.phase
            )
            *
            .2;


        const hue =
            (
                p.hue +
                time *
                .02
            )
            %
            360;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size *
            (
                1 +
                force *
                2
            ),
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            rainbow(
                hue,
                100,
                70
            );


        ctx.globalAlpha =
            Math.min(
                1,
                brightness *
                .4
            );


        ctx.shadowBlur =
            8 +
            force *
            15;


        ctx.shadowColor =
            rainbow(
                hue
            );


        ctx.fill();

    }


    ctx.shadowBlur =
        0;

}


/* ================================================================
   CURSOR RIFT
   ================================================================ */

function drawCursorRift(
    time
) {

    const x =
        mouse.x;

    const y =
        mouse.y;


    const radius =
        55 +
        mouse.speed *
        5;


    /*
    Rotating chromatic halo.
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const hue =
            (
                time *
                .08 +
                i *
                120
            )
            %
            360;


        ctx.beginPath();

        ctx.arc(

            x,

            y,

            radius +
            i *
            9,

            time *
            .001 +
            i,

            time *
            .001 +
            i +
            Math.PI *
            1.45

        );


        ctx.strokeStyle =
            rainbow(
                hue,
                100,
                68
            );


        ctx.lineWidth =
            1.5 +
            mouse.speed *
            .08;


        ctx.globalAlpha =
            .15 +
            mouse.speed *
            .015;


        ctx.shadowBlur =
            18;


        ctx.shadowColor =
            rainbow(
                hue
            );


        ctx.stroke();

    }


    /*
    Tiny dimensional core.
    */

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,.18)"
    );


    gradient.addColorStop(
        .15,
        "rgba(0,255,255,.08)"
    );


    gradient.addColorStop(
        .5,
        "rgba(150,0,255,.025)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


}


/* ================================================================
   MAIN LOOP
   ================================================================ */

function animate(
    time
) {

    /*
    Smooth cursor.
    */

    mouse.x +=
        (
            mouse.tx -
            mouse.x
        )
        *
        .075;


    mouse.y +=
        (
            mouse.ty -
            mouse.y
        )
        *
        .075;


    mouse.speed *=
        .92;


    /*
    Clear.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    glow.clearRect(
        0,
        0,
        W,
        H
    );


    /*
    Fractures.
    */

    drawFractures(
        time
    );


    /*
    Particles.
    */

    drawParticles(
        time
    );


    /*
    Cursor anomaly.
    */

    drawCursorRift(
        time
    );


    requestAnimationFrame(
        animate
    );

}


requestAnimationFrame(
    animate
);


/* ================================================================
   CLEANUP
   ================================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            fractureCanvas.width = 1;
            fractureCanvas.height = 1;

            glowCanvas.width = 1;
            glowCanvas.height = 1;

        }
        catch (_) {}

    }
);

</script>

</body>
</html>
```
