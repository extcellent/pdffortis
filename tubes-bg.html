<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimensional Rift · Beyond Reality</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            cursor: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #glow {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: all 0.08s ease;
        }
        #status {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.05);
            font-size: 10px;
            letter-spacing: 2px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="glow"></div>
    <div id="status">◈ 4D FRACTAL FLOW ◈</div>
    <canvas id="canvas"></canvas>

    <script>
        // ================================================================
        // 4D FRACTAL FLOW · HYPERSPACE VISUALIZER
        // This is NOT particles. This is a LIVING 4D FRACTAL
        // that responds to your consciousness (cursor)
        // ================================================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ---- Mouse/Touch ----
        let mx = W/2, my = H/2;
        let tx = W/2, ty = H/2;
        
        document.addEventListener('mousemove', (e) => {
            tx = e.clientX;
            ty = e.clientY;
            document.getElementById('glow').style.left = e.clientX + 'px';
            document.getElementById('glow').style.top = e.clientY + 'px';
        });
        
        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t) {
                tx = t.clientX;
                ty = t.clientY;
                document.getElementById('glow').style.left = t.clientX + 'px';
                document.getElementById('glow').style.top = t.clientY + 'px';
            }
        }, { passive: true });

        // ---- Fractal Parameters ----
        const MAX_ITER = 256;
        const ZOOM_SPEED = 0.003;
        let zoom = 1.0;
        let offsetX = 0;
        let offsetY = 0;
        let time = 0;

        // ---- Color palette generator (dynamic) ----
        function getPalette(t) {
            const pal = [];
            const baseHue = (t * 0.02) % 360;
            for (let i = 0; i < 256; i++) {
                const hue = (baseHue + i * 1.5 + Math.sin(i * 0.05 + t * 0.01) * 20) % 360;
                const sat = 70 + Math.sin(i * 0.1 + t * 0.005) * 25;
                const lig = 40 + Math.sin(i * 0.08 + t * 0.007) * 35;
                pal.push(`hsl(${hue}, ${sat}%, ${lig}%)`);
            }
            return pal;
        }

        // ---- 4D Fractal function (Mandelbrot set with 4th dimension) ----
        function fractal4D(x, y, z, w) {
            let cr = x;
            let ci = y;
            let zr = 0;
            let zi = 0;
            let zr2 = 0;
            let zi2 = 0;
            let iter = 0;
            
            // 4D rotation influence
            const rot = Math.sin(w * 0.5) * 0.3;
            const rot2 = Math.cos(w * 0.7) * 0.3;
            
            while (iter < MAX_ITER) {
                // 4D complex multiplication with rotation
                const temp = zr * zr - zi * zi + cr + rot * Math.sin(iter * 0.1 + w);
                zi = 2 * zr * zi + ci + rot2 * Math.cos(iter * 0.1 + w);
                zr = temp;
                
                zr2 = zr * zr;
                zi2 = zi * zi;
                
                if (zr2 + zi2 > 4) break;
                iter++;
            }
            
            // Smooth coloring
            if (iter === MAX_ITER) return 0;
            
            const log_zn = Math.log(zr2 + zi2) / 2;
            const nu = Math.log(log_zn / Math.log(2)) / Math.log(2);
            return iter + 1 - nu;
        }

        // ---- Render the fractal ----
        function render() {
            // Smooth mouse follow
            mx += (tx - mx) * 0.03;
            my += (ty - my) * 0.03;
            
            time += 0.5;
            zoom += (1.0 + Math.sin(time * 0.001) * 0.2 - zoom) * 0.01;
            
            // Mouse influences offset
            const targetOffsetX = (mx / W - 0.5) * 2.5 * (1/zoom);
            const targetOffsetY = (my / H - 0.5) * 2.5 * (1/zoom);
            offsetX += (targetOffsetX - offsetX) * 0.02;
            offsetY += (targetOffsetY - offsetY) * 0.02;
            
            // Get dynamic palette
            const palette = getPalette(time);
            
            // Create image data
            const imageData = ctx.createImageData(W, H);
            const data = imageData.data;
            
            const aspect = W / H;
            const scale = 4.0 / zoom;
            const w = time * 0.001; // 4th dimension
            
            // Parallel-like processing (optimized)
            for (let py = 0; py < H; py++) {
                for (let px = 0; px < W; px++) {
                    const idx = (py * W + px) * 4;
                    
                    // Map pixel to complex plane
                    const x = (px / W) * scale * aspect - scale * aspect / 2 + offsetX;
                    const y = (py / H) * scale - scale / 2 + offsetY;
                    
                    // Calculate fractal with 4D influence
                    const val = fractal4D(x, y, 0.3 * Math.sin(w), 0.3 * Math.cos(w));
                    
                    if (val > 0 && val < MAX_ITER) {
                        const colorIdx = Math.floor(val * 0.8) % 256;
                        const color = palette[colorIdx];
                        
                        // Parse HSL
                        const hsl = color.match(/hsl\(([^,]+), ([^%]+)%, ([^%]+)%\)/);
                        if (hsl) {
                            const h = parseFloat(hsl[1]);
                            const s = parseFloat(hsl[2]);
                            const l = parseFloat(hsl[3]);
                            
                            // Convert HSL to RGB
                            const c = (1 - Math.abs(2 * l / 100 - 1)) * s / 100;
                            const x2 = c * (1 - Math.abs((h / 60) % 2 - 1));
                            const m = l / 100 - c / 2;
                            
                            let r, g, b;
                            if (h < 60) { r = c; g = x2; b = 0; }
                            else if (h < 120) { r = x2; g = c; b = 0; }
                            else if (h < 180) { r = 0; g = c; b = x2; }
                            else if (h < 240) { r = 0; g = x2; b = c; }
                            else if (h < 300) { r = x2; g = 0; b = c; }
                            else { r = c; g = 0; b = x2; }
                            
                            data[idx] = Math.floor((r + m) * 255);
                            data[idx+1] = Math.floor((g + m) * 255);
                            data[idx+2] = Math.floor((b + m) * 255);
                            data[idx+3] = 255;
                        }
                    } else {
                        // Deep space background
                        const depth = Math.sin((px / W) * 10 + (py / H) * 10 + time * 0.001) * 20 + 10;
                        data[idx] = 0;
                        data[idx+1] = 0;
                        data[idx+2] = Math.floor(depth);
                        data[idx+3] = 255;
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Overlay luminous grid (4D projection)
            drawGrid(ctx, time);
        }

        // ---- 4D Grid projection overlay ----
        function drawGrid(ctx, t) {
            ctx.save();
            ctx.globalAlpha = 0.03;
            ctx.strokeStyle = `hsl(${(t * 0.02) % 360}, 100%, 70%)`;
            ctx.lineWidth = 0.5;
            
            const spacing = 40;
            const offset = (t * 0.01) % spacing;
            
            // Rotating grid
            for (let i = -20; i < 20; i++) {
                const x = (i * spacing + offset) % W;
                const y = (i * spacing + offset * 1.5) % H;
                
                ctx.beginPath();
                const rot = Math.sin(t * 0.002 + i * 0.1) * 0.5;
                ctx.moveTo(x - 50 * rot, 0);
                ctx.lineTo(x + 50 * rot, H);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, y + 50 * rot);
                ctx.lineTo(W, y - 50 * rot);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // ---- Click to warp dimensions ----
        function warpReality() {
            // Sudden zoom pulse
            zoom *= 1.5;
            // Random 4D shift
            time += 50;
            
            // Visual feedback
            document.getElementById('status').style.color = `rgba(255,255,255,${0.5 + Math.random() * 0.5})`;
            setTimeout(() => {
                document.getElementById('status').style.color = 'rgba(255,255,255,0.05)';
            }, 500);
        }

        canvas.addEventListener('click', warpReality);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            warpReality();
        }, { passive: false });

        // ---- Animate ----
        function animate() {
            render();
            requestAnimationFrame(animate);
        }

        animate();

        // ---- Resize handler ----
        window.addEventListener('resize', () => {
            resize();
        });

        console.log('◈ 4D Fractal Flow active · click to warp reality ◈');
    </script>
</body>
</html>
