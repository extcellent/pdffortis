<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Weaver · Living Light</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            overflow: hidden;
            height: 100vh;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .cursor-glow {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: all 0.05s ease;
        }
    </style>
</head>
<body>
    <div class="cursor-glow" id="cursorGlow"></div>
    <canvas id="canvas"></canvas>

    <script>
        // ================================================================
        //  ORIGINAL & UNIQUE: PARTICLE NEBULA WITH DYNAMIC CONSTELLATIONS
        //  Pure visual experience - no text, no distractions
        // ================================================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        // ---- Resize ----
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ---- Mouse tracking ----
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetX = width / 2;
        let targetY = height / 2;
        
        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            const glow = document.getElementById('cursorGlow');
            if (glow) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }
        });

        // ---- Touch support ----
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch) {
                targetX = touch.clientX;
                targetY = touch.clientY;
                const glow = document.getElementById('cursorGlow');
                if (glow) {
                    glow.style.left = touch.clientX + 'px';
                    glow.style.top = touch.clientY + 'px';
                }
            }
        }, { passive: true });

        // ---- Color utilities ----
        function randomColor() {
            const h = Math.random() * 360;
            const s = 70 + Math.random() * 30;
            const l = 50 + Math.random() * 30;
            return `hsl(${h}, ${s}%, ${l}%)`;
        }

        // ---- Particle class ----
        class Particle {
            constructor() {
                this.reset();
                this.baseSize = 1.5 + Math.random() * 4;
                this.hue = Math.random() * 360;
                this.sat = 70 + Math.random() * 30;
                this.light = 50 + Math.random() * 30;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.phase = Math.random() * Math.PI * 2;
                this.freq = 0.005 + Math.random() * 0.02;
                this.amplitude = 20 + Math.random() * 80;
                this.orbitRadius = 50 + Math.random() * 200;
                this.orbitSpeed = 0.002 + Math.random() * 0.01;
                this.orbitAngle = Math.random() * Math.PI * 2;
                this.type = Math.random() > 0.7 ? 'star' : 'dot';
                this.trail = [];
                this.maxTrail = 6 + Math.floor(Math.random() * 10);
                this.pulse = Math.random() * Math.PI * 2;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = 1 + Math.random() * 3;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
            }

            update(mx, my) {
                const dx = mx - this.x;
                const dy = my - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 1) {
                    const force = 0.008 * (1 + 50 / (dist + 10));
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                const edge = 50;
                if (this.x < edge) this.vx += 0.02;
                if (this.x > width - edge) this.vx -= 0.02;
                if (this.y < edge) this.vy += 0.02;
                if (this.y > height - edge) this.vy -= 0.02;

                this.vx *= 0.995;
                this.vy *= 0.995;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 2) {
                    this.vx = (this.vx / speed) * 2;
                    this.vy = (this.vy / speed) * 2;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.orbitAngle += this.orbitSpeed;
                const wobbleX = Math.sin(this.orbitAngle) * this.amplitude * 0.1;
                const wobbleY = Math.cos(this.orbitAngle * 0.7) * this.amplitude * 0.1;
                this.x += wobbleX * 0.02;
                this.y += wobbleY * 0.02;

                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }

                this.hue = (this.hue + 0.1) % 360;
                this.sat = 70 + Math.sin(Date.now() * 0.001 + this.phase) * 15;
                this.light = 50 + Math.sin(Date.now() * 0.002 + this.phase * 1.5) * 20;
                this.pulse += 0.02;
            }

            draw(ctx) {
                const pulseSize = 1 + Math.sin(this.pulse) * 0.2;
                
                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        const alpha = (i / this.trail.length) * 0.3;
                        const size = (i / this.trail.length) * this.radius * 0.8 * pulseSize;
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha})`;
                        ctx.fill();
                    }
                }

                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 4 * pulseSize
                );
                gradient.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0.9)`);
                gradient.addColorStop(0.3, `hsla(${this.hue + 30}, ${this.sat}%, ${this.light}%, 0.4)`);
                gradient.addColorStop(1, `hsla(${this.hue + 60}, ${this.sat}%, ${this.light}%, 0)`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 4 * pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.8 * pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue + 40}, 100%, 90%, 0.8)`;
                ctx.fill();

                if (this.type === 'star') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(Date.now() * 0.001 + this.phase);
                    const spikes = 5;
                    const outerRadius = this.radius * 2.5 * pulseSize;
                    const innerRadius = this.radius * 1 * pulseSize;
                    ctx.beginPath();
                    for (let i = 0; i < spikes * 2; i++) {
                        const radius = i % 2 === 0 ? outerRadius : innerRadius;
                        const angle = (i / (spikes * 2)) * Math.PI * 2;
                        if (i === 0) ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                        else ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                    }
                    ctx.closePath();
                    ctx.fillStyle = `hsla(${this.hue + 80}, 100%, 85%, 0.5)`;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // ---- Create particles ----
        const particles = [];
        const particleCount = 200;
        
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // ---- Connection lines (constellation effect) ----
        function drawConnections(ctx) {
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 120) {
                        const alpha = (1 - dist / 120) * 0.15;
                        const hue = (particles[i].hue + particles[j].hue) / 2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `hsla(${hue}, 80%, 70%, ${alpha})`;
                        ctx.stroke();
                    }
                }
            }
        }

        // ---- Background nebula ----
        function drawNebula(ctx) {
            const time = Date.now() * 0.0001;
            const gradient = ctx.createRadialGradient(
                width * 0.3 + Math.sin(time) * 100, 
                height * 0.4 + Math.cos(time * 0.7) * 100, 
                0,
                width * 0.5, 
                height * 0.5, 
                Math.max(width, height) * 0.8
            );
            
            const hue1 = (Date.now() * 0.005) % 360;
            const hue2 = (hue1 + 60) % 360;
            const hue3 = (hue1 + 120) % 360;
            
            gradient.addColorStop(0, `hsla(${hue1}, 80%, 20%, 0.1)`);
            gradient.addColorStop(0.3, `hsla(${hue2}, 70%, 15%, 0.05)`);
            gradient.addColorStop(0.7, `hsla(${hue3}, 60%, 10%, 0.03)`);
            gradient.addColorStop(1, 'rgba(10, 10, 15, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // ---- Click to "shatter" particles ----
        function shatterParticles() {
            particles.forEach(p => {
                p.vx += (Math.random() - 0.5) * 6;
                p.vy += (Math.random() - 0.5) * 6;
                p.hue = Math.random() * 360;
                p.sat = 80 + Math.random() * 20;
                p.light = 60 + Math.random() * 30;
                p.maxTrail = 8 + Math.floor(Math.random() * 15);
            });
        }

        canvas.addEventListener('click', shatterParticles);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shatterParticles();
        }, { passive: false });

        // ---- Animation loop ----
        function animate() {
            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            drawNebula(ctx);

            for (const p of particles) {
                p.update(mouseX, mouseY);
                p.draw(ctx);
            }

            drawConnections(ctx);

            const vignette = ctx.createRadialGradient(
                width/2, height/2, height * 0.2,
                width/2, height/2, height * 0.9
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, width, height);

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            resize();
            particles.forEach(p => {
                p.x = Math.min(p.x, width);
                p.y = Math.min(p.y, height);
            });
        });
    </script>
</body>
</html>
