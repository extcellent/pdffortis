precision highp float;


/*
──────────────────────────────────────────────────────────────────────
UNIFORMS
──────────────────────────────────────────────────────────────────────
*/

uniform vec2 u_resolution;

uniform vec2 u_mouse;

uniform vec2 u_velocity;

uniform float u_time;

uniform float u_pulse;

uniform float u_energy;


/*
──────────────────────────────────────────────────────────────────────
HASH
──────────────────────────────────────────────────────────────────────
*/

float hash21(vec2 p) {

    p =
      fract(p *
      vec2(123.34,456.21));

    p +=
      dot(
        p,
        p + 45.32
      );

    return fract(
      p.x * p.y
    );
}


/*
──────────────────────────────────────────────────────────────────────
NOISE
──────────────────────────────────────────────────────────────────────
*/

float noise(vec2 p) {

    vec2 i =
      floor(p);

    vec2 f =
      fract(p);

    f =
      f * f *
      (3.0 - 2.0 * f);

    return mix(

      mix(
        hash21(i),
        hash21(i + vec2(1.0,0.0)),
        f.x
      ),

      mix(
        hash21(i + vec2(0.0,1.0)),
        hash21(i + vec2(1.0,1.0)),
        f.x
      ),

      f.y
    );
}


/*
──────────────────────────────────────────────────────────────────────
FRACTAL NOISE
──────────────────────────────────────────────────────────────────────
*/

float fbm(vec2 p) {

    float value = 0.0;

    float amp = .5;

    for(int i = 0; i < 6; i++) {

        value +=
          noise(p) * amp;

        p *= 2.02;

        amp *= .5;
    }

    return value;
}


/*
──────────────────────────────────────────────────────────────────────
MAIN
──────────────────────────────────────────────────────────────────────
*/

void main() {


    /*
    Normalize coordinates.
    */

    vec2 uv =
      gl_FragCoord.xy /
      u_resolution.xy;

    uv =
      uv * 2.0 - 1.0;

    uv.x *=
      u_resolution.x /
      u_resolution.y;


    /*
    Mouse coordinates.
    */

    vec2 mouse =
      u_mouse /
      u_resolution;

    mouse =
      mouse * 2.0 - 1.0;

    mouse.x *=
      u_resolution.x /
      u_resolution.y;


    /*
    Distance from singularity.
    */

    vec2 delta =
      uv - mouse;

    float dist =
      length(delta);


    /*
    Angle around singularity.
    */

    float angle =
      atan(
        delta.y,
        delta.x
      );


    /*
    GRAVITATIONAL LENSING

    The closer the pixel is to the core,
    the more aggressively it bends.
    */

    float gravity =
      0.12 /
      max(
        dist,
        .035
      );


    gravity =
      min(
        gravity,
        1.8
      );


    uv +=
      normalize(
        delta + .0001
      )
      *
      gravity
      *
      .055;


    /*
    Rotating spacetime.
    */

    float swirl =
      1.8 *
      exp(
        -dist * 2.4
      );


    float a =
      angle +
      swirl +
      u_time * .00025;


    vec2 warped =
      vec2(
        cos(a),
        sin(a)
      );


    /*
    Volumetric nebula.
    */

    vec2 nebulaUV =
      warped *
      (3.0 + dist * 2.0);


    nebulaUV +=
      vec2(
        u_time * .00008,
        -u_time * .00005
      );


    float cloud =
      fbm(
        nebulaUV +
        fbm(nebulaUV * .7)
      );


    /*
    Energy filaments.
    */

    float filament =
      abs(
        sin(
          a * 13.0
          +
          dist * 18.0
          -
          u_time * .001
        )
      );


    filament =
      pow(
        filament,
        16.0
      );


    /*
    Ring system.
    */

    float ring =
      abs(
        sin(
          dist * 31.0
          -
          u_time * .002
          +
          cloud * 3.0
        )
      );


    ring =
      pow(
        ring,
        28.0
      );


    /*
    EVENT HORIZON
    */

    float horizon =
      smoothstep(
        .17,
        .055,
        dist
      );


    /*
    CORE
    */

    float core =
      exp(
        -dist * 42.0
      );


    /*
    ENERGY BURST
    */

    float pulseRing =
      abs(
        dist -
        (.05 +
         u_pulse * .55)
      );


    pulseRing =
      smoothstep(
        .045,
        .0,
        pulseRing

      *
      u_pulse;


    /*
    Cursor velocity creates directional

    */

    vec2 velocity =
      u_velocity * .002;

    float velocityField =
      dot(
        normalize(delta + .001),
        normalize(
          velocity +
          vec2(.001)
        )
      );


    velocityField *=
      length(velocity) *
      3.0;


    /*
    COLORS
    */

    vec3 cyan =

        .003,
        .008

    Nebula coloring.

    color +=

      cloud *
      cloud *
      .22;

    color +=
      violet *
      filament *
      .32;

    color +=
      magenta *
      ring *
      .20;


    /*
    Accretion disk.

    disk *=

      .45 *

    color +=

    color +=
      violet *

    color *=

    /*
    Core.

    color +=

    /*

    /*

    float fringe =

    Vignette.

        1.0
      );

}

/*
══════════════════════════════════════════════════════════════════════
                          SHADER COMPILATION
══════════════════════════════════════════════════════════════════════
*/

function compileShader(
  type,
  source
) {

  const shader =
    gl.createShader(type);

  gl.shaderSource(
    shader,
    source
  );

  gl.compileShader(
    shader
  );


  if (
    !gl.getShaderParameter(
      shader,
      gl.COMPILE_STATUS
    )
  ) {

    console.error(
      gl.getShaderInfoLog(shader)
    );

    return null;
  }


  return shader;
}


function createProgram() {

  const vs =
    compileShader(
      gl.VERTEX_SHADER,
      vertexShaderSource
    );

  const fs =
    compileShader(
      gl.FRAGMENT_SHADER,
      fragmentShaderSource
    );


  if (!vs || !fs)
    return null;


  const p =
    gl.createProgram();


  gl.attachShader(
    p,
    vs
  );

  gl.attachShader(
    p,
    fs
  );

  gl.linkProgram(
    p
  );


  if (
    !gl.getProgramParameter(
      p,
      gl.LINK_STATUS
    )
  ) {

    console.error(
      gl.getProgramInfoLog(p)
    );

    return null;
  }


  return p;
}


if (hasGL) {

  program =
    createProgram();


  if (program) {

    gl.useProgram(
      program
    );


    uniforms.resolution =
      gl.getUniformLocation(

        "u_resolution"

    uniforms.mouse =

    uniforms.velocity =

    uniforms.pulse =

        program,
        "u_energy"
      );

    Full-screen triangle.

      gl.ARRAY_BUFFER,
      buffer
    );

      new Float32Array([
        -1,-1,
         3,-1,
        -1, 3
      ]),
      gl.STATIC_DRAW
    );

      gl.getAttribLocation(
        program,
        "position"
      );

      position

      2,
      gl.FLOAT,
      false,
      0,
      0
    );

══════════════════════════════════════════════════════════════════════
                         PARTICLE SYSTEM
══════════════════════════════════════════════════════════════════════

const pctx =
  particleCanvas.getContext(
    "2d"
  );


const mobile =
  width < 700;

  mobile

        1200,

const particles = [];


class Particle {

  constructor() {

    this.reset();
  }


  reset() {

    const angle =
      Math.random() *
      Math.PI *
      2;


    /*
    Most particles start around
    an orbital disk.
    */

    const radius =
      Math.pow(
        Math.random(),
        .55
      ) *
      Math.max(
        width,
        height
      )
      *
      .75;


    this.x =
      width * .5 +
      Math.cos(angle) *
      radius;


    this.y =
      height * .5 +
      Math.sin(angle) *
      radius *
      .35;


    this.z =
      Math.random() * 2 - 1;


    this.size =
      Math.random() <
      .92
        ? Math.random() * 1.4
        : 2 + Math.random() * 2.5;


    this.alpha =
      .15 +
      Math.random() * .75;


    this.speed =
      .15 +
      Math.random() * .75;


    this.angle =
      angle;


    this.radius =
      radius;


    this.phase =
      Math.random() *
      Math.PI *
      2;


    this.hue =
      175 +
      Math.random() *
      170;
  }


  update(t) {

    /*
    Orbit the center.
    */

    const centerX =
      width * .5;

    const centerY =
      height * .5;


    const dx =
      this.x -
      centerX;

    const dy =
      this.y -
      centerY;


    const r =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    /*
    Orbital velocity.

    Close particles move much faster.
    */

    const orbital =
      .0007 *
      (
        1 +
        900 / Math.max(r,90)
      );


    this.angle +=
      orbital *
      this.speed;


    /*
    The cursor bends the orbit.
    */

    const mdx =
      pointer.x -
      this.x;

    const mdy =
      pointer.y -
      this.y;


    const md =
      Math.sqrt(
        mdx * mdx +
        mdy * mdy
      );


    const influence =
      Math.max(
        0,
        1 -
        md / 550
      );


    const gravitational =
      influence *
      influence;


    this.angle +=
      gravitational *
      .035;


    /*
    Recalculate position.
    */

    this.x =
      centerX +
      Math.cos(
        this.angle
      ) *
      this.radius;


    this.y =
      centerY +
      Math.sin(
        this.angle
      ) *
      this.radius *
      (.25 + this.z * .15);


    /*
    Cursor displacement.
    */

    this.x +=
      pointer.vx *
      gravitational *
      .65;

    this.y +=
      pointer.vy *
      gravitational *
      .65;


    /*
    Wave interaction.
    */

    for (
      const wave of shockwaves

      const wx =
        this.x -
        wave.x;

      const wy =
        this.y -
        wave.y;


      const distance =
        Math.sqrt(
          wx * wx +
          wy * wy
        );


      const ringDistance =
        Math.abs(
          distance -
          wave.radius
        );


      if (
        ringDistance <
        35
      ) {

        const force =
          (
            1 -
            ringDistance / 35
          ) *
          wave.life;


        this.x +=
          (
            wx /
            Math.max(distance,1)
          )
          *
          force *
          10;


        this.y +=
          (
            wy /
            Math.max(distance,1)
          )
          *
          force *
          10;
      }
    }
  }


  draw() {

    const perspective =
      1 /
      (
        1 +
        this.z * .45
      );


    const size =
      this.size *
      perspective;


    const a =
      this.alpha *
      perspective;


    pctx.beginPath();


    pctx.fillStyle =
      `hsla(
        ${this.hue},
        100%,
        72%,
        ${a}
      )`;


    pctx.arc(
      this.x,
      this.y,
      size,
      0,
      Math.PI * 2
    );


    pctx.fill();


    /*
    High-energy particles get a glow.
    */

    if (size > 2.1) {

      pctx.beginPath();

      pctx.fillStyle =
        `hsla(
          ${this.hue},
          100%,
          70%,
          ${a * .12}
        )`;

      pctx.arc(
        this.x,
        this.y,
        size * 6,
        0,
        Math.PI * 2
      );

      pctx.fill();
    }
  }
}


for (
  let i = 0;
  i < PARTICLE_COUNT;
  i++
) {

  particles.push(
    new Particle()
  );
}


/*
══════════════════════════════════════════════════════════════════════
                          SHOCKWAVES
══════════════════════════════════════════════════════════════════════
*/

const shockwaves = [];


function createShockwave() {

  shockwaves.push({

    x: pointer.x,

    y: pointer.y,

    radius: 0,

    life: 1,

    hue:
      180 +
      Math.random() *
      150
  });


  if (
    shockwaves.length >
    8
  ) {

    shockwaves.shift();
  }
}


/*
══════════════════════════════════════════════════════════════════════
                          PARTICLE RENDER
══════════════════════════════════════════════════════════════════════
*/

function renderParticles(t) {

  pctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  /*
  Slight persistence.

  This is what makes particles
  leave beautiful energy trails.
  */

  pctx.fillStyle =
    "rgba(0,1,5,.16)";


  pctx.fillRect(
    0,
    0,
    width,
    height
  );


  pctx.globalCompositeOperation =
    "lighter";


  for (
    const particle
    of particles
  ) {

    particle.update(t);

    particle.draw();
  }


  /*
  Shockwave rings.
  */

  for (
    let i =
      shockwaves.length - 1;

    i >= 0;

    i--
  ) {

    const wave =
      shockwaves[i];


    wave.radius +=
      9 +
      pointer.speed *
      .35;


    wave.life -=
      .012;


    if (
      wave.life <= 0
    ) {

      shockwaves.splice(
        i,
        1
      );

      continue;
    }


    /*
    Outer glow.
    */

    pctx.beginPath();

    pctx.arc(
      wave.x,
      wave.y,
      wave.radius,
      0,
      Math.PI * 2
    );


    pctx.strokeStyle =
      `hsla(
        ${wave.hue},
        100%,
        70%,
        ${wave.life * .08}
      )`;


    pctx.lineWidth =
      24 *
      wave.life;


    pctx.stroke();


    /*
    Sharp energy edge.
    */

    pctx.beginPath();

    pctx.arc(
      wave.x,
      wave.y,
      wave.radius,
      0,
      Math.PI * 2
    );


    pctx.strokeStyle =
      `hsla(
        ${wave.hue},
        100%,
        80%,
        ${wave.life * .65}
      )`;


    pctx.lineWidth =
      1;


    pctx.stroke();
  }


  pctx.globalCompositeOperation =
    "source-over";
}


/*
══════════════════════════════════════════════════════════════════════
                            GL RENDER
══════════════════════════════════════════════════════════════════════
*/

let start =
  performance.now();


function renderGL(now) {

  if (
    !hasGL ||
    !program
  )
    return;


  gl.useProgram(
    program
  );


  gl.uniform2f(
    uniforms.resolution,
    glCanvas.width,
    glCanvas.height
  );


  gl.uniform2f(
    uniforms.mouse,
    pointer.x * dpr,
    (
      height -
      pointer.y
    ) * dpr
  );


  gl.uniform2f(
    uniforms.velocity,
    pointer.vx,
    pointer.vy
  );


  gl.uniform1f(
    uniforms.time,
    now - start
  );


  gl.uniform1f(
    uniforms.pulse,
    pointer.pulse
  );


  gl.uniform1f(
    uniforms.energy,
    pointer.energy
  );


  gl.drawArrays(
    gl.TRIANGLES,
    0,
    3
  );
}


/*
══════════════════════════════════════════════════════════════════════
                            MAIN LOOP
══════════════════════════════════════════════════════════════════════
*/

function frame(now) {


  /*
  Smooth pointer.
  */

  pointer.x +=
    (
      pointer.targetX -
      pointer.x
    ) * .075;


  pointer.y +=
    (
      pointer.targetY -
      pointer.y
    ) * .075;


  pointer.vx *= .92;
  pointer.vy *= .92;


  /*
  Energy decay.
  */

  pointer.pulse *= .965;
  pointer.energy *= .94;


  renderGL(now);

  renderParticles(now);


  requestAnimationFrame(
    frame
  );
}


requestAnimationFrame(
  frame
);


/*
══════════════════════════════════════════════════════════════════════
                           IDLE MODE
══════════════════════════════════════════════════════════════════════

When the mouse doesn't move, the system doesn't stop.

It slowly breathes.
*/

let idleTime = 0;


setInterval(
  () => {

    if (
      Math.abs(pointer.vx) <
        .05 &&
      Math.abs(pointer.vy) <
        .05
    ) {

      idleTime += 1;


      if (
        idleTime >
        10
      ) {

        pointer.targetX =
          width * .5 +
          Math.sin(
            performance.now() *
            .00015
          ) *
          width *
          .08;


        pointer.targetY =
          height * .5 +
          Math.cos(
            performance.now() *
            .00019
          ) *
          height *
          .06;
      }

    } else {

      idleTime = 0;
    }

  },
  100
);


/*
══════════════════════════════════════════════════════════════════════
                         SPACEBAR EVENT
══════════════════════════════════════════════════════════════════════

Space = artificial singularity collapse.
*/

window.addEventListener(
  "keydown",
  e => {

    if (
      e.code ===
      "Space"
    ) {

      e.preventDefault();

      pointer.pulse = 1;

      pointer.energy = 1.5;

      createShockwave();

      createShockwave();

    }

  }
);


/*
══════════════════════════════════════════════════════════════════════
                          DOUBLE CLICK
══════════════════════════════════════════════════════════════════════

Double click creates a much larger event.
*/

window.addEventListener(
  "dblclick",
  () => {

    pointer.pulse = 1.5;

    pointer.energy = 2;


    for (
      let i = 0;
      i < 4;
      i++
    ) {

      setTimeout(
        createShockwave,
        i * 120
      );
    }

  }
);


/*
══════════════════════════════════════════════════════════════════════
                         TAB VISIBILITY
══════════════════════════════════════════════════════════════════════

Don't burn GPU when the page isn't visible.
*/

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      pointer.vx = 0;
      pointer.vy = 0;
    }

  }
);


})();
</script>
