<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  html,body{margin:0;height:100%;background:#050507;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="tubes-canvas"></canvas>
<script type="module">
  var canvas = document.getElementById('tubes-canvas');

  function randomColors(count){
    return Array.from({length:count},function(){
      return "#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
    });
  }

  import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js')
    .then(function(mod){
      var TubesCursor = mod.default;
      var app = TubesCursor(canvas, {
        tubes:{
          colors:["#f967fb","#53bc28","#6958d5"],
          lights:{ intensity:200, colors:["#83f36e","#fe8a2e","#ff008a","#60aed5"] }
        }
      });
      canvas.addEventListener('click', function(){
        app.tubes.setColors(randomColors(3));
        app.tubes.setLightsColors(randomColors(4));
      });
    })
    .catch(function(err){
      console.error('Failed to load TubesCursor:', err);
    });
</script>
</body>
</html>
