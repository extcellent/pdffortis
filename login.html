<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – PDFortis</title>
<link rel="icon" href="/pdfortis_big.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --gray-50:#f9fafb;
    --gray-100:#f3f4f6;
    --gray-200:#e5e7eb;
    --gray-300:#d1d5db;
    --gray-400:#9ca3af;
    --gray-500:#6b7280;
    --gray-600:#4b5563;
    --gray-700:#374151;
    --gray-900:#111827;
    --blue:#2563eb;
    --blue-l:#eff6ff;
    --shadow-lg:0 20px 60px rgba(0,0,0,.13);
    --font:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:var(--font);color:var(--gray-900);}
  body{
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4); backdrop-filter:blur(3px);
    min-height:100vh;
  }
  .modal{
    background:var(--white); border-radius:14px; box-shadow:var(--shadow-lg);
    width:420px; max-width:94vw; overflow:hidden; animation:modalIn .2s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .modal-hd{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; border-bottom:1px solid var(--gray-100);
  }
  .modal-hd h3{font-size:15px; font-weight:700; margin:0;}
  .modal-x{
    background:none; border:none; font-size:18px; color:var(--gray-400);
    cursor:pointer; line-height:1; padding:2px 5px; border-radius:4px; transition:all .12s;
    text-decoration:none;
  }
  .modal-x:hover{background:var(--gray-100); color:var(--gray-700);}
  .modal-body{padding:28px 24px 32px; text-align:center;}
  .sub{color:var(--gray-500); font-size:13px; margin:0 0 24px;}
  #google-btn-container{display:flex; justify-content:center; min-height:44px;}
  .status{margin-top:16px; font-size:13px; color:var(--gray-500); min-height:18px;}
  .status.err{color:#dc2626;}
  .spinner{
    display:inline-block; width:14px; height:14px; border:2px solid var(--gray-200);
    border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:7px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

  <div class="modal">
    <div class="modal-hd">
      <h3>Sign in</h3>
      <a class="modal-x" href="/index.html">✕</a>
    </div>
    <div class="modal-body">
      <p class="sub">Sign in</p>
      <div id="google-btn-container"></div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Session-Helfer, SUPABASE_URL/ANON_KEY, pfSaveSession, sbGetProfile, sbUpsertProfile, sbValidateToken -->
  <script src="/supabase.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    const GOOGLE_CLIENT_ID = '762322811608-apb6sln1ek7jhdupa2h98f5ho5e97d57.apps.googleusercontent.com';
    const LS_TOKDAT = 'pf_tokdat';
    let _googleNonce = null;

    function getRedirectTarget(){
      const p = new URLSearchParams(location.search).get('redirect');
      return p && p.startsWith('/') ? p : '/index.html';
    }

    function setStatus(msg, isErr){
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.classList.toggle('err', !!isErr);
    }

    async function initGoogleSignIn(){
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleSignIn, 150);
        return;
      }
      const nonce = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));
      const encoded = new TextEncoder().encode(nonce);
      const hashBuf = await crypto.subtle.digest('SHA-256', encoded);
      const hashedNonce = Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      _googleNonce = nonce;

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        nonce: hashedNonce,
        use_fedcm_for_prompt: true,
        use_fedcm_for_button: true
      });

      google.accounts.id.renderButton(
        document.getElementById('google-btn-container'),
        { theme: 'outline', size: 'large', width: 300, text: 'continue_with' }
      );
    }

    async function handleGoogleCredential(response){
      setStatus('<span class="spinner"></span>Anmeldung läuft…');
      try{
        const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=id_token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ provider: 'google', id_token: response.credential, nonce: _googleNonce })
        });
        const d = await r.json();
        if(d.error || !d.access_token){
          setStatus('Google-Anmeldung fehlgeschlagen. Bitte erneut versuchen.', true);
          return;
        }

        pfSaveSession(d);

        let profile = await sbGetProfile(d.user.id, d.access_token);
        if(!profile){
          profile = await sbUpsertProfile(d.user.id, {
            email: d.user.email,
            display_name: d.user.user_metadata?.name || d.user.email?.split('@')[0]
          }, d.access_token);
        }

        try{
          const userObj = {...d.user, access_token: d.access_token};
          userObj.user_metadata = {...(d.user.user_metadata||{}), name: profile?.display_name || d.user.user_metadata?.name};
          localStorage.setItem('pf_session', JSON.stringify({
            user: userObj,
            expires_at: Date.now()+(d.expires_in||3600)*1000
          }));
        }catch(e){}

        if(profile?.company_token){
          const tok = await sbValidateToken(profile.company_token);
          if(tok){ localStorage.setItem(LS_TOKDAT, JSON.stringify(tok)); }
        }

        setStatus('Angemeldet — weiterleiten…');
        window.location.href = getRedirectTarget();

      }catch(e){
        console.warn('Google sign-in error', e);
        setStatus('Verbindungsfehler. Bitte erneut versuchen.', true);
      }
    }

    window.addEventListener('load', initGoogleSignIn);
  </script>

</body>
</html>
